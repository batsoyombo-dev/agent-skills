name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile plugins/*/skills/*/*.py
      - name: Shell syntax
        run: for f in install.sh tests/run.sh tests/*/*.sh; do bash -n "$f"; done
      - name: Plugin manifests are valid JSON
        run: for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do python3 -m json.tool "$f" >/dev/null; done
      - name: Tests
        run: bash tests/run.sh
